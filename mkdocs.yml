site_name: PyroApp Documentation
site_description: Learn and use PyroApp thermodynamic functions in Microsoft Excel.
site_url: https://evnekdev.github.io/pyroapp-docs/
repo_url: https://github.com/evnekdev/pyroapp-docs
repo_name: evnekdev/pyroapp-docs
edit_uri: edit/master/docs/

plugins:
  - search
  - glightbox

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js

extra_css:
  - stylesheets/extra.css

extra:
  analytics:
    provider: google
    property: G-FE9FXJ05SL

exclude_docs: |
  additional-information.md
  chemapp-parallel.md
  chemapp_rs.md
  chemapproxy.md
  composition-conversion.md
  cpfit-project.md
  factsage-chemapp-definitions.md
  factsage-compound-format.md
  factsage-solution-format.md
  fsmanager.md
  liqenginebin.md
  sqldata.md
  tutorials/installation.md

theme:
  name: material
  font:
    text: Segoe UI
    code: Consolas
  palette:
    - scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: deep orange
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy

nav:
  - Home:
      - Overview: index.md
      - Install PyroApp 2: installation-2.0.md
      - Quickstart: quickstart.md
      - Downloads: download.md
  - Learn PyroApp:
      - Excel and the PyroApp API: excel-api.md
      - ChemApp and licensing: chemapp.md
      - Datafiles: chemsage-datafile.md
      - Common definitions: common-definitions.md
      - Phase models: phase-models-overview.md
      - System units: system_units.md
      - Architecture and transports: pyroapp-architecture-2.0.md
      - Runtime transport controls: runtime-transports.md
      - Troubleshooting: troubleshooting.md
  - CA_CALCULATE:
      - Guide: functions/ca_calculate.md
      - Input conditions: input_conditions.md
      - Output properties: output_properties.md
      - First equilibrium: tutorials/first-equilibrium.md
      - Phase selection: tutorials/phase-selection.md
      - Target calculations: tutorials/target-calculation.md
      - Remote gRPC calculations: tutorials/remote-grpc.md
  - DAT workflows:
      - Working with DAT files: tutorials/datafiles.md
      - ChemApp runtime information: tutorials/chemapp-info.md
  - Function reference: function-reference.md
  - Legacy PyroApp 1.x:
      - Installation: installation-1.0.md
      - Architecture: pyroapp-architecture-1.0.md
  - Related projects: related-projects.md
  - About: about.md
