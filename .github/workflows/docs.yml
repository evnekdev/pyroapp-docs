name: Deploy docs

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pyroapp-docs-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docs.txt

      - name: Verify workbook safety and immutable artifacts
        run: |
          python scripts/verify_teaching_workbooks.py --source docs/tutorial-assets/workbooks
          python scripts/verify_published_workbooks.py --source docs/tutorial-assets/workbooks

      - name: Build documentation
        run: python -m mkdocs build --strict

      - name: Verify built downloadable workbooks
        run: python scripts/verify_published_workbooks.py --source docs/tutorial-assets/workbooks --published site/tutorial-assets/workbooks

      - name: Deploy to GitHub Pages branch
        run: python -m mkdocs gh-deploy --force
